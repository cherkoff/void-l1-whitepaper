<text x="86" y="990" font-size="20" fill="#1e293b">• migration требует</text>
<text x="86" y="1016" font-size="20" fill="#1e293b">DecisionOutcome::Accepted</text>
<text x="86" y="1042" font-size="20" fill="#1e293b">• trust risk: governance capture</text>
<rect x="590" y="850" width="470" height="225" rx="22" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
