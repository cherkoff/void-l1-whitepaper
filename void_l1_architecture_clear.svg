<text x="1200" y="78" text-anchor="middle" font-size="38" font-weight="900" fill="#0f172a">Void-L1 — четкая архитектура по WHITEPAPER_TECHNICAL.md</text>
<text x="1200" y="116" text-anchor="middle" font-size="22" fill="#475569">Proof-of-Ephemera Layer-1: proof-carrying tx → stateless verification → hot set + accumulator root → reversible expiry через Archive Market</text>
<rect x="60" y="160" width="380" height="245" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/>
<text x="84" y="202" font-size="25" font-weight="800" fill="#0f172a">1. Клиенты</text>
<line x1="82" y1="218" x2="418" y2="218" stroke="#0891B2" stroke-width="2" opacity="0.35"/>
<text x="86" y="248" font-size="20" fill="#1e293b">• Wallet / DApp / CLI</text>
<text x="86" y="274" font-size="20" fill="#1e293b">формирует intent и payload</text>
<text x="86" y="300" font-size="20" fill="#1e293b">• Ed25519 подпись с domain</text>
<text x="86" y="326" font-size="20" fill="#1e293b">separation</text>
<text x="86" y="352" font-size="20" fill="#1e293b">• Light client хранит только</text>
<text x="86" y="378" font-size="20" fill="#1e293b">root R_t и проверяет proofs</text>
<rect x="500" y="160" width="420" height="245" rx="22" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/>
<text x="524" y="202" font-size="25" font-weight="800" fill="#0f172a">2. Proof-Carrying Tx</text>
<line x1="522" y1="218" x2="898" y2="218" stroke="#0F766E" stroke-width="2" opacity="0.35"/>
<text x="526" y="248" font-size="20" fill="#1e293b">• sender_commitment,</text>
<text x="526" y="274" font-size="20" fill="#1e293b">intent_type, payload</text>
<text x="526" y="300" font-size="20" fill="#1e293b">• witnesses + accumulator proofs</text>
<text x="526" y="326" font-size="20" fill="#1e293b">против R_t</text>
<text x="526" y="352" font-size="20" fill="#1e293b">• vdf_proof, fee_policy,</text>
<text x="526" y="378" font-size="20" fill="#1e293b">conflict_tags, valid_until_epoch</text>
<rect x="980" y="160" width="420" height="245" rx="22" fill="#F7FEE7" stroke="#65A30D" stroke-width="3"/>
<text x="1004" y="202" font-size="25" font-weight="800" fill="#0f172a">3. Network / Mempool</text>
<line x1="1002" y1="218" x2="1378" y2="218" stroke="#65A30D" stroke-width="2" opacity="0.35"/>
<text x="1006" y="248" font-size="20" fill="#1e293b">• Node API + gossip; сейчас HTTP</text>
<text x="1006" y="274" font-size="20" fill="#1e293b">polling, future libp2p</text>
<text x="1006" y="300" font-size="20" fill="#1e293b">• replay-protection dedup</text>
<text x="1006" y="326" font-size="20" fill="#1e293b">• nonce enforcement, dynamic VDF</text>
<text x="1006" y="352" font-size="20" fill="#1e293b">difficulty</text>
<text x="1006" y="378" font-size="20" fill="#1e293b">• conflict_tags для parallel</text>
<rect x="1460" y="160" width="420" height="245" rx="22" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
<text x="1484" y="202" font-size="25" font-weight="800" fill="#0f172a">4. Consensus / Verify</text>
<line x1="1482" y1="218" x2="1858" y2="218" stroke="#EA580C" stroke-width="2" opacity="0.35"/>
<text x="1486" y="248" font-size="20" fill="#1e293b">• current devnet: round-robin</text>
<text x="1486" y="274" font-size="20" fill="#1e293b">proposer</text>
<text x="1486" y="300" font-size="20" fill="#1e293b">• HotStuff-style BFT есть как</text>
<text x="1486" y="326" font-size="20" fill="#1e293b">reference, но live loop не wired</text>
<text x="1486" y="352" font-size="20" fill="#1e293b">• stateless verifier проверяет</text>
<text x="1486" y="378" font-size="20" fill="#1e293b">proofs, sig, VDF, nonce,</text>
<rect x="1940" y="160" width="400" height="245" rx="22" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
<text x="1964" y="202" font-size="25" font-weight="800" fill="#0f172a">5. State Root</text>
<line x1="1962" y1="218" x2="2318" y2="218" stroke="#4F46E5" stroke-width="2" opacity="0.35"/>
<text x="1966" y="248" font-size="20" fill="#1e293b">• VoidStateCommitment_t = hash</text>
<text x="1966" y="274" font-size="20" fill="#1e293b">of layered accumulators</text>
<text x="1966" y="300" font-size="20" fill="#1e293b">• validators держат compact</text>
<text x="1966" y="326" font-size="20" fill="#1e293b">root + active hot set</text>
<text x="1966" y="352" font-size="20" fill="#1e293b">• новый root R_{t+1} после</text>
<text x="1966" y="378" font-size="20" fill="#1e293b">valid state transition</text>
<line x1="440" y1="282" x2="500" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="470.0" y="270.0" text-anchor="middle" font-size="17" fill="#475569" font-weight="800">build</text>
<line x1="920" y1="282" x2="980" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="950.0" y="270.0" text-anchor="middle" font-size="17" fill="#475569" font-weight="800">submit</text>
<line x1="1400" y1="282" x2="1460" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1430.0" y="270.0" text-anchor="middle" font-size="17" fill="#475569" font-weight="800">select</text>
<line x1="1880" y1="282" x2="1940" y2="282" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1910.0" y="270.0" text-anchor="middle" font-size="17" fill="#475569" font-weight="800">commit</text>
<rect x="60" y="475" width="380" height="195" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/>
<text x="84" y="517" font-size="25" font-weight="800" fill="#0f172a">Light Client Path</text>
<line x1="82" y1="533" x2="418" y2="533" stroke="#0891B2" stroke-width="2" opacity="0.35"/>
<text x="86" y="563" font-size="20" fill="#1e293b">• получает affected leaves +</text>
<text x="86" y="589" font-size="20" fill="#1e293b">proofs от full node</text>
<text x="86" y="615" font-size="20" fill="#1e293b">• сам проверяет inclusion</text>
<text x="86" y="641" font-size="20" fill="#1e293b">against R_t</text>
<rect x="500" y="475" width="420" height="195" rx="22" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/>
<text x="524" y="517" font-size="25" font-weight="800" fill="#0f172a">Client-side VDF</text>
<line x1="522" y1="533" x2="898" y2="533" stroke="#0F766E" stroke-width="2" opacity="0.35"/>
<text x="526" y="563" font-size="20" fill="#1e293b">• challenge =</text>
<text x="526" y="589" font-size="20" fill="#1e293b">H(sender_identity_hash,</text>
<text x="526" y="615" font-size="20" fill="#1e293b">network_magic)</text>
<text x="526" y="641" font-size="20" fill="#1e293b">• difficulty растёт от</text>
<rect x="1460" y="475" width="420" height="245" rx="22" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
<text x="1484" y="517" font-size="25" font-weight="800" fill="#0f172a">Execution / Intent VM</text>
<line x1="1482" y1="533" x2="1858" y2="533" stroke="#EA580C" stroke-width="2" opacity="0.35"/>
<text x="1486" y="563" font-size="20" fill="#1e293b">• apply intent-specific state</text>
<text x="1486" y="589" font-size="20" fill="#1e293b">transition</text>
<text x="1486" y="615" font-size="20" fill="#1e293b">• tx fees → block producer</text>
<text x="1486" y="641" font-size="20" fill="#1e293b">• emission → validators; rent</text>
<text x="1486" y="667" font-size="20" fill="#1e293b">burn/governance-directed</text>
<text x="1486" y="693" font-size="20" fill="#1e293b">• VM trait + 14-opcode reference</text>
<rect x="1940" y="475" width="400" height="245" rx="22" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
<text x="1964" y="517" font-size="25" font-weight="800" fill="#0f172a">Layered Accumulators</text>
<line x1="1962" y1="533" x2="2318" y2="533" stroke="#4F46E5" stroke-width="2" opacity="0.35"/>
<text x="1966" y="563" font-size="20" fill="#1e293b">• BalanceAccumulator</text>
<text x="1966" y="589" font-size="20" fill="#1e293b">• AssetRegistry</text>
<text x="1966" y="615" font-size="20" fill="#1e293b">• NftCollectionRoot</text>
<text x="1966" y="641" font-size="20" fill="#1e293b">• SmartAccountPolicyRoot</text>
<text x="1966" y="667" font-size="20" fill="#1e293b">• ValidatorCommitmentRoot</text>
<text x="1966" y="693" font-size="20" fill="#1e293b">• v0: sorted-leaf Merkle +</text>
