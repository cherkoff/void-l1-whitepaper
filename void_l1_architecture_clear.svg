<text x="1244" y="892" font-size="25" font-weight="800" fill="#0f172a">6. State-Rent / TTL</text>
<line x1="1242" y1="908" x2="1558" y2="908" stroke="#CA8A04" stroke-width="2" opacity="0.35"/>
<text x="1246" y="938" font-size="20" fill="#1e293b">• classify(O,</text>
<text x="1246" y="964" font-size="20" fill="#1e293b">current_epoch)</text>
<text x="1246" y="990" font-size="20" fill="#1e293b">• Paid: stays active</text>
<text x="1246" y="1016" font-size="20" fill="#1e293b">• Grace: overdue but within</text>
<text x="1246" y="1042" font-size="20" fill="#1e293b">G=16 epochs</text>
<rect x="1640" y="850" width="340" height="225" rx="22" fill="#FDF4FF" stroke="#A21CAF" stroke-width="3"/>
<text x="1664" y="892" font-size="25" font-weight="800" fill="#0f172a">GhostObject</text>
<line x1="1662" y1="908" x2="1958" y2="908" stroke="#A21CAF" stroke-width="2" opacity="0.35"/>
<text x="1666" y="938" font-size="20" fill="#1e293b">• не удаляется</text>
<text x="1666" y="964" font-size="20" fill="#1e293b">криптографически</text>
<text x="1666" y="990" font-size="20" fill="#1e293b">• removed from active hot</text>
<text x="1666" y="1016" font-size="20" fill="#1e293b">set</text>
<text x="1666" y="1042" font-size="20" fill="#1e293b">• commitment remains</text>
<rect x="2040" y="850" width="300" height="225" rx="22" fill="#FDF4FF" stroke="#A21CAF" stroke-width="3"/>
<text x="2064" y="892" font-size="25" font-weight="800" fill="#0f172a">Archive Market</text>
<line x1="2062" y1="908" x2="2318" y2="908" stroke="#A21CAF" stroke-width="2" opacity="0.35"/>
<text x="2066" y="938" font-size="20" fill="#1e293b">• archive nodes store</text>
<text x="2066" y="964" font-size="20" fill="#1e293b">original bytes</text>
<text x="2066" y="990" font-size="20" fill="#1e293b">• ArchiveOffer: price,</text>
<text x="2066" y="1016" font-size="20" fill="#1e293b">bond, deadline,</text>
<text x="2066" y="1042" font-size="20" fill="#1e293b">reputation</text>
